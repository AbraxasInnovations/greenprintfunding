[program:crypto-arb-bot]
command=/opt/crypto-arb-bot/venv/bin/gunicorn --config /opt/crypto-arb-bot/gunicorn_config.py webhook_server:app
directory=/opt/crypto-arb-bot
user=crypto-bot
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
environment=
    PYTHONPATH="/opt/crypto-arb-bot",
    SERVER_SOFTWARE="gunicorn",
    WEBHOOK_URL="http://138.197.119.176/webhook/telegram",
    TELEGRAM_WEBHOOK_URL="http://138.197.119.176/webhook/telegram",
    BOOMFI_WEBHOOK_URL="http://138.197.119.176/8000/webhook/boomfi",
    TELEGRAM_BOT_TOKEN="%(ENV_TELEGRAM_BOT_TOKEN)s",
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    ENCRYPTION_MASTER_KEY="%(ENV_ENCRYPTION_MASTER_KEY)s",
    BOOMFI_WEBHOOK_SECRET="%(ENV_BOOMFI_WEBHOOK_SECRET)s",
    TELEGRAM_WEBHOOK_SECRET="%(ENV_TELEGRAM_WEBHOOK_SECRET)s"
stdout_logfile=/opt/crypto-arb-bot/logs/supervisor_stdout.log
stderr_logfile=/opt/crypto-arb-bot/logs/supervisor_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5 